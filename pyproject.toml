[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "botl-pdf"
dynamic = ["version"]
description = "High-performance PDF processing: extract text, tables, images with a Rust + C core."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "botl-pdf Contributors" }
]
keywords = ["pdf", "text-extraction", "tables", "layout-analysis", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]

[project.optional-dependencies]
render = ["Pillow>=10.0"]
debug = ["Pillow>=10.0", "matplotlib>=3.8"]
ocr-tesseract = ["pytesseract>=0.3", "Pillow>=10.0"]
ocr-easyocr = ["easyocr>=1.7", "Pillow>=10.0"]
pandas = ["pandas>=2.0"]
cli = ["typer>=0.12", "rich>=13.0"]
all = ["botl-pdf[render,debug,ocr-tesseract,pandas,cli]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/Shivamjohri247/botl-pdf"
Repository = "https://github.com/Shivamjohri247/botl-pdf"

[project.scripts]
botl-pdf = "botl_pdf.cli.main:app"

[tool.maturin]
python-source = "python"
module-name = "botl_pdf._core"
manifest-path = "rust/botl-pdf-python/Cargo.toml"
features = ["pyo3/abi3-py38", "pyo3/extension-module"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow",
    "benchmark: performance benchmarks",
]
