name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: pip install 'maturin>=1.5,<1.7' 'twine>=6'

      - name: Build wheel
        run: maturin build --release --out dist --interpreter python3.12

      - name: Build sdist
        run: maturin sdist --out dist

      - name: Strip License-File from wheel metadata
        run: |
          python - <<'PYEOF'
          import zipfile, os, tempfile, shutil, glob

          for whl in glob.glob("dist/*.whl"):
              print(f"Processing {whl}")
              tmpdir = tempfile.mkdtemp()
              try:
                  with zipfile.ZipFile(whl, 'r') as z:
                      z.extractall(tmpdir)
                      for root, dirs, files in os.walk(tmpdir):
                          for f in files:
                              if f == 'METADATA':
                                  path = os.path.join(root, f)
                                  with open(path) as fh:
                                      lines = fh.readlines()
                                  filtered = [l for l in lines if not l.startswith('License-File:')]
                                  removed = len(lines) - len(filtered)
                                  if removed:
                                      with open(path, 'w') as fh:
                                          fh.writelines(filtered)
                                      print(f"  Stripped {removed} License-File line(s)")
                  os.remove(whl)
                  with zipfile.ZipFile(whl, 'w', zipfile.ZIP_DEFLATED) as z:
                      for root, dirs, files in os.walk(tmpdir):
                          for f in files:
                              fp = os.path.join(root, f)
                              arcname = os.path.relpath(fp, tmpdir)
                              z.write(fp, arcname)
              finally:
                  shutil.rmtree(tmpdir)
          PYEOF

      - name: Verify package metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/botl-pdf
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: |
          pip install 'twine>=6'
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
