name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  # ------------------------------------------------------------------ #
  # Rust lint + test
  # ------------------------------------------------------------------ #
  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/botl-pdf-core -> target
            rust/botl-pdf-csys -> target
            rust/botl-pdf-python -> target

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all

  # ------------------------------------------------------------------ #
  # Python matrix test (maturin develop + pytest)
  # ------------------------------------------------------------------ #
  python-test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/botl-pdf-core -> target
            rust/botl-pdf-csys -> target
            rust/botl-pdf-python -> target

      - name: Install maturin and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'maturin>=1.7,<2'
          pip install ".[dev]"

      - name: Build extension module (maturin develop)
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release
          rust-toolchain: stable

      - name: Install test dependencies
        run: pip install pytest pytest-cov pytest-benchmark hypothesis

      - name: Run Python tests
        run: pytest tests/python/ -ra --strict-markers
